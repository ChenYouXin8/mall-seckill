# =============================================================================
# mall-seckill 入口 Nginx 限流配置（文档 7.7 应用入口限流）
# 前置：Nginx 已编译 ngx_http_limit_req_module（默认包含）
# 策略：limit_req 20r/s burst=40 nodelay —— 令牌桶对整机入口限流，
#       超限请求直接 503（客户端可重试）；应用内另有按活动维度的 Redis 令牌桶限流。
# 用法：放入 /etc/nginx/conf.d/seckill.conf（docker compose 已挂载）
# =============================================================================
upstream seckill_app {
    # 应用实例（docker compose 服务名：app；本机部署可改为 127.0.0.1:8080）
    server app:8080;
    keepalive 32;
}

# 限流区：key=客户端 IP，zone 20MB 约可记录 16 万 IP
limit_req_zone $binary_remote_addr zone=seckill_zone:20m rate=20r/s;

# 请求体大小（抢购请求无大 body）
client_max_body_size 1m;

server {
    listen 80;
    server_name _;

    # 秒杀入口：Nginx 层限流 + 反代到应用
    location /api/seckill/ {
        limit_req zone=seckill_zone burst=40 nodelay;
        limit_req_status 503;

        proxy_pass http://seckill_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 健康检查
    location /actuator/health {
        proxy_pass http://seckill_app;
        proxy_set_header Host $host;
    }

    # 其余路径透传
    location / {
        proxy_pass http://seckill_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
