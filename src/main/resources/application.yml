server:
  port: 8080
  tomcat:
    # 高并发入口调优（文档第 8 节：单机 QPS 目标 ≥5000）
    threads:
      max: 1000
      min-spare: 100
    accept-count: 4000
    max-connections: 20000
    connection-timeout: 5000

spring:
  application:
    name: mall-seckill
  datasource:
    url: jdbc:mysql://localhost:3306/mall_seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: seckill
    password: seckill123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 200
      minimum-idle: 20
      connection-timeout: 10000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      lettuce:
        pool:
          max-active: 256
          max-idle: 64
          min-idle: 16
  rabbitmq:
    host: localhost
    port: 5672
    username: seckill
    password: seckill123
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 50
        concurrency: 5
        max-concurrency: 10

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

seckill:
  test-token: "test-token"
  pay-expire-minutes: 2
  address-ttl-seconds: 7200
  rate-limit:
    enabled: true
    capacity: 100
    rate-per-second: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
