server:
  port: 8080

spring:
  application:
    name: mall-seckill
  datasource:
    url: jdbc:mysql://localhost:3306/mall_seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: seckill
    password: seckill123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

seckill:
  test-token: "test-token"
  pay-expire-minutes: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
